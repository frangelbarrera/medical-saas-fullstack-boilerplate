# Deploy to Production via SSH
#
# This workflow is triggered on pushes to main after CI passes. It connects
# to the production server via SSH, pulls the latest changes, applies
# database migrations with the privileged URL, rebuilds the Docker containers
# and restarts them. The application container always connects through the
# limited `medical_app` role provisioned by ops/db/init.
#
# Required GitHub secrets:
#   SERVER_HOST     - production server hostname or IP
#   SERVER_USER     - SSH username
#   SERVER_SSH_KEY  - SSH private key (PEM format)
#   DEPLOY_PATH     - absolute path to the app directory on the server

name: Deploy to Production

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            # Migrations run first, as the privileged user (the app role
            # cannot create tables - by design).
            docker compose run --rm migrate
            docker compose up -d --build app
            docker image prune -f
            # Readiness probe: a real database round-trip, not just the port.
            sleep 10
            curl -fsS http://localhost:3000/api/v1/health/ready
