name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Lint, Typecheck, Test, Build, E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medical_saas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET: ci_jwt_secret_minimum_32_characters_long
      ENCRYPTION_KEY: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
      PHI_HMAC_KEY: fedcba0987654321fedcba0987654321fedcba0987654321fedcba0987654321
      PAYMENT_WEBHOOK_SECRET: ci_webhook_secret_16
      # Integration tests run as the LIMITED role so row-level security is
      # exercised exactly as in production. REQUIRE_DB=1 makes a missing
      # database a hard failure - skipped authorization tests can never
      # produce a green job.
      TEST_DATABASE_URL: postgresql://medical_app:ci_app_password@localhost:5432/medical_saas_ci?schema=public
      E2E_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/medical_saas_e2e?schema=public
      E2E_APP_URL: postgresql://medical_app:ci_app_password@localhost:5432/medical_saas_e2e?schema=public
      REQUIRE_DB: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema services/data/prisma/schema.prisma

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Provision App Role and Databases
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" <<'SQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'medical_app') THEN
                CREATE ROLE medical_app LOGIN PASSWORD 'ci_app_password';
              ELSE
                ALTER ROLE medical_app LOGIN PASSWORD 'ci_app_password';
              END IF;
            END
            $$;
          SQL
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE medical_saas_e2e"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "GRANT CONNECT ON DATABASE medical_saas_ci TO medical_app"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "GRANT CONNECT ON DATABASE medical_saas_e2e TO medical_app"

      - name: Apply Migrations (CI database)
        run: npx prisma migrate deploy --schema services/data/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medical_saas_ci?schema=public

      - name: Unit + Integration Tests (DB required)
        run: npm run test:ci

      - name: Build SPA
        run: npm run build

      - name: E2E Tests (Playwright)
        run: npx playwright install chromium --with-deps && npm run e2e:prepare && npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  supply-chain:
    name: Supply Chain (SBOM + secrets + audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: moderate

      # Pinned to the exact commit of the v2.3.9 release tag. A malformed
      # pin here made this action unresolvable and failed every CI run.
      - name: Secret Scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: npm audit (moderate severity gate)
        run: npm audit --audit-level=moderate

      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm --output-format JSON --output-file sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          retention-days: 30
