# Deterministic test database (P2: reproducible validation).
#
# `docker compose -f docker-compose.test.yml up -d` starts a disposable
# PostgreSQL 17 that matches the defaults of tests/setup.ts and CI, so a
# clean clone reaches green tests with two commands:
#   docker compose -f docker-compose.test.yml up -d
#   npm ci && npx prisma migrate deploy && npm test
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: medical_saas_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medical_saas_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
